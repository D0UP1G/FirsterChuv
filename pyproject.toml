[project]
name = "firsterchuv"
version = "0.1.0"
description = "Платформа для блиц-турниров по спортивному программированию"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.1.2",
    "djangorestframework==3.18.3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
